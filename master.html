<header class="topbar"><div><div class="eyebrow">✦ ВДОХНОВЕНИЕ АСТРАЛА</div><h1>Кабинет мастера</h1><p>Игры, игроки и отправленные ходы</p></div><div class="top-actions"><a class="back" href="games.html">🎲 Игры</a><a class="back" href="cabinet.html">👑 Кабинет игрока</a></div></header>
<main class="content" style="max-width:1200px;margin:30px auto">
<p id="status">Проверка доступа…</p><section id="masterReviewPanel"></section><section id="freeShardPanel" class="entity" style="display:none"><div class="section-head"><h2>🏝️ Банк свободных осколков</h2><span class="muted">Создание нейтральных осколков и передача игрокам</span></div><form id="freeShardForm" class="form-grid"><label>Игра<select name="game" id="freeShardGame"></select></label><label>Название<input name="name" required></label><label>Тип<select name="type" id="freeShardType"></select></label><label>Размер<select name="size" id="freeShardSize"></select></label><label>Доход<input name="income" type="number" min="0" step=".5" value="0"></label><label>Раса<input name="race"></label><label>Население<input name="population"></label><label>Настроение<select name="mood" id="freeShardMood"></select></label><label>Гарнизон<input name="garrison" type="number" min="0" step=".5" value="0"></label><label>Снабжение<input name="supply" type="number" min="0" step=".5" value="0"></label><label>Защита<input name="defense" type="number" min="0" step=".5" value="0"></label><label>Ландшафт<select name="terrain" id="freeShardTerrain"></select></label><label class="wide">Описание<textarea name="description"></textarea></label><div class="wide"><button class="primary">Создать свободный осколок</button></div></form><div id="freeShardList"></div></section><section id="gamesSection"></section>
<section id="turnSection" style="display:none"><div class="section-head"><h2>Отправленные ходы</h2><button id="backGames">← К играм</button></div><div id="turns"></div></section>
<section id="detailSection" style="display:none"><div class="section-head"><h2 id="detailTitle">Ход</h2><button id="backTurns">← К ходам</button></div><div id="turnDetail"></div></section>
</main>
