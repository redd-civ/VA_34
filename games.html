<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VA-34 — Игры</title>
<link rel="stylesheet" href="cabinet.css">
</head>
<body>
<main style="max-width:1100px;margin:30px auto;padding:20px">
  <p><a href="cabinet.html">← Личный кабинет</a></p>
  <h1>Игры VA-34</h1>
  <p id="status">Загрузка…</p>

  <section>
    <h2>Доступные игры</h2>
    <div id="games"></div>
  </section>

  <section>
    <h2>Мои заявки</h2>
    <div id="myApplications"></div>
  </section>

  <section id="masterPanel" style="display:none">
    <h2>Мастер: создать игру</h2>
    <form id="createGame" class="entity">
      <input name="name" required placeholder="Название игры">
      <textarea name="description" placeholder="Описание и правила кампании"></textarea>
      <label>Максимум игроков
        <input name="max" type="number" min="1" max="100" value="10">
      </label>
      <button class="primary">Создать игру</button>
    </form>
    <h2>Мои игры и заявки игроков</h2>
    <div id="myGames"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="cloud-store.js"></script>
<script src="games.js"></script>
</body>
</html>
